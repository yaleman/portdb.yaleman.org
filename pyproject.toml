[project]
name = "portdb"
description = "Source and data generator for the portDB Zola site"
license = { text = "MIT" }
version = "0.0.2"
authors = [{ name = "James Hodgkinson", email = "james@terminaloutcomes.com" }]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]


[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.15.7",                    #tricking TOML formatter into being nice
    "ty>=0.0.24",
    "types-requests>=2.32.4.20260107",
    "pytest>=9.0.3",
]
